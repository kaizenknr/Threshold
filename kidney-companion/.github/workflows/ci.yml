name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kidney-companion
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: kidney-companion/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Secret scan (no keys in client bundles)
        run: pnpm scan:secrets
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
